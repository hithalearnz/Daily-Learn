name: Daily Engineering Log

on:
  schedule:
    # Runs every day at 8:30 PM IST
    - cron: "0 15 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily engineering log
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")

          mkdir -p "logs/$YEAR/$MONTH"

          FILE="logs/$YEAR/$MONTH/$DATE.md"

          if [ ! -f "$FILE" ]; then
            cat > "$FILE" << EOF
          # Engineering Log — $DATE

          ## Daily Activity

          Automated engineering-log maintenance entry.

          ## Current Learning Areas

          - Python & DSA
          - Artificial Intelligence / Generative AI
          - React & Full Stack Development
          - REST APIs
          - Blockchain / Web3

          ## Note

          This entry records the daily maintenance heartbeat
          of the engineering-learning repository.
          EOF
          fi

      - name: Update activity index
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          echo "" >> README.md
          echo "- $DATE — Daily engineering log maintained" >> README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily engineering log - $(date -u +"%Y-%m-%d")"
            git push
          fi
